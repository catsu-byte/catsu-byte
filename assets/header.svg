<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">catsu-byte — hands almost touching</title>
  <desc id="desc">Terminal-inspired ASCII artwork of two mirrored hands, each extending two fingers toward the center.</desc>

  <rect width="1200" height="380" rx="24" fill="#0d1117"/>

  <g opacity="0.22" stroke="#238636" stroke-width="1">
    <path d="M0 76H1200M0 152H1200M0 228H1200M0 304H1200"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380M720 0V380M780 0V380M840 0V380M900 0V380M960 0V380M1020 0V380M1080 0V380M1140 0V380"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
    <text x="66" y="58" fill="#39d353" font-size="24" font-weight="700">catsu-byte</text>
    <text x="1134" y="58" fill="#8b949e" font-size="14" text-anchor="end" letter-spacing="3">BUILD / TEST / SHIP</text>

    <text x="600" y="126" fill="#f0f6fc" font-size="17" text-anchor="middle" xml:space="preserve">
      <tspan x="600" dy="0">╭──────────╮                                            ╭──────────╮</tspan>
      <tspan x="600" dy="38">│  ╲        ╲────────────────╮  ╭────────────────╱        ╱  │</tspan>
      <tspan x="600" dy="38">│   ╲________╲───────────────╯  ╰───────────────╱________╱   │</tspan>
      <tspan x="600" dy="38">│   ╱________╱─────────────╮      ╭─────────────╲________╲   │</tspan>
      <tspan x="600" dy="38">│  ╱        ╱──────────────╯      ╰──────────────╲        ╲  │</tspan>
      <tspan x="600" dy="38">╰──────────╯                                            ╰──────────╯</tspan>
    </text>

    <circle cx="590" cy="163" r="3.5" fill="#39d353"/>
    <circle cx="610" cy="163" r="3.5" fill="#39d353"/>
    <text x="600" y="345" fill="#8b949e" font-size="14" text-anchor="middle" letter-spacing="4">PRACTICAL SOFTWARE, BUILT WITH CARE</text>
  </g>
</svg>
